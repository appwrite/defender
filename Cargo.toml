[package]
name = "defender"
version = "0.1.0"
edition = "2021"
description = "High-performance streaming HTTP virus scanner using ClamAV public databases"
license = "Apache-2.0"
publish = false

[dependencies]
aho-corasick = "=1.1.3"
anyhow = "=1.0.95"
arc-swap = "=1.7.1"
axum = { version = "=0.8.1", features = ["multipart"] }
bytes = "=1.10.0"
flate2 = "=1.0.35"
hex = "=0.4.3"
md-5 = "=0.10.6"
memchr = "=2.7.4"
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
reqwest = { version = "=0.11.27", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustc-hash = "=2.1.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.137"
sha1 = "=0.10.6"
sha2 = "=0.10.8"
tar = "=0.4.43"
thiserror = "=2.0.11"
tokio = { version = "=1.43.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.17"
tower = "=0.5.2"
tower-http = { version = "=0.6.2", features = ["limit", "trace", "timeout"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }

# jemalloc returns unused pages after a CVD hot-reload; glibc typically does not.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "=0.7.0", features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = "=0.7.0"

[dev-dependencies]
criterion = { version = "=0.5.1", features = ["html_reports", "async_tokio"] }
http-body-util = "=0.1.2"
tempfile = "=3.15.0"
tower = { version = "=0.5.2", features = ["util"] }

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "http"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
