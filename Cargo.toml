[package]
name = "defender"
version = "0.1.0"
edition = "2021"
description = "High-performance streaming HTTP virus scanner using ClamAV public databases"
license = "Apache-2.0"
publish = false

[dependencies]
aho-corasick = "=1.1.5"
anyhow = "=1.0.104"
arc-swap = "=1.9.5"
axum = { version = "=0.8.9", features = ["multipart"] }
bytes = "=1.12.2"
flate2 = "=1.1.11"
hex = "=0.4.3"
md-5 = "=0.11.0"
memchr = "=2.8.3"
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustc-hash = "=2.1.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
tar = "=0.4.46"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["limit", "trace", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# jemalloc returns unused pages after a CVD hot-reload; glibc typically does not.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "=0.7.0", features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = "=0.7.0"

[dev-dependencies]
criterion = { version = "=0.8.2", features = ["html_reports", "async_tokio"] }
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "http"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
